# Tests + bundle freshness for the customer-zone edge router, on both providers.
#
# src/edge-router-worker.js is a committed build artifact: the Deploy button
# deploys it and NORG's backend pins it by SHA-256. A source edit without a
# rebuild would ship stale code while the repo looked correct, so this rebuilds
# and fails on any diff. The suites import the worker source directly and use
# only node:test / node:assert — nothing to install; esbuild is pinned via npx.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Worker + Lambda tests, bundle freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run worker tests
        run: node --test workers/*.test.mjs

      - name: Run AWS CloudFront tests
        run: node --test aws/tests/*.test.mjs

      - name: Rebuild the bundles
        run: |
          node build.mjs
          node aws/build.mjs

      - name: Assert the committed bundles are up to date
        run: |
          # --porcelain, not `git diff --exit-code`: diff ignores UNTRACKED
          # files, so a never-committed bundle would still pass.
          STALE=$(git status --porcelain -- src/ aws/src/)
          if [ -n "$STALE" ]; then
            echo "Built bundles differ from the committed ones:"
            git diff -- src/ aws/src/
            echo "Run: npm run build && git add src/ aws/src/"
            exit 1
          fi
