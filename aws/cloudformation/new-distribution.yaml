AWSTemplateFormatVersion: "2010-09-09"

# NORG Edge Router — creates a NEW CloudFront distribution in front of your site.
#
# MUST be launched in us-east-1. Lambda@Edge functions can only live there; the
# distribution itself is global either way.
#
# Use this template when your site is NOT already served through CloudFront.
# It builds a distribution in front of your existing origin, and you repoint DNS
# to it when you are satisfied. If you ALREADY have a CloudFront distribution,
# use attach-existing.yaml instead — CloudFormation cannot modify a
# distribution it did not create, and replacing yours would lose its config.
#
# WHAT THIS COSTS YOU IN CONTROL. Creating the distribution means this template
# chooses your caching behaviour, and the choice is a plain one: pages are not
# cached at the edge. The default behaviour uses CloudFront's managed
# CachingDisabled policy, so every page request reaches the router and your
# origin answers it exactly as it would without CloudFront; cookies and query
# strings are forwarded. Only the asset carve-outs are cached. Review the
# OriginRequestPolicy and StaticCachePolicy below before launching in front of
# a site that matters.

Description: NORG edge router on a new CloudFront distribution (Lambda@Edge, us-east-1)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Your site }
        Parameters: [OriginDomainName, AlternateDomainNames, AcmCertificateArn]
      - Label: { default: NORG install credentials }
        Parameters: [SiteId, SiteKey, NorgEnvironment]
      - Label: { default: Advanced }
        Parameters:
          [ArtifactBucket, ArtifactKey, HeartbeatArtifactKey, ArtifactObjectVersion,
           HeartbeatObjectVersion, NorgApiUrl, NorgContentBase, StripFallbackEnabled,
           LazyRenderEnabled, EdgeDisabled, ReplicateSecret, AlarmTopicArn, EnableRateLimit, RateLimitPerFiveMinutes]

Parameters:
  OriginDomainName:
    Type: String
    Description: >-
      The hostname CloudFront should fetch your real pages from, e.g.
      origin.example.com. This must NOT be the public domain you will later
      point at CloudFront, or requests will loop back into the distribution.
    AllowedPattern: ^[a-zA-Z0-9.-]+$

  AlternateDomainNames:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional. Public domains this distribution will serve once you cut DNS
      over, e.g. www.example.com. Requires AcmCertificateArn. Leave blank to
      test on the *.cloudfront.net name first, which is the safer order.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >-
      Optional. ACM certificate ARN in us-east-1 covering the alternate domain
      names. Required if, and only if, you set them.

  SiteId:
    Type: String
    Description: The SITE_ID NORG issued when you registered this site.
    AllowedPattern: ^[0-9a-fA-F-]{36}$

  SiteKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      The NORG_SITE_KEY NORG showed you once. Leave blank if you set SecretArn.
      Given here, this stack creates a Secrets Manager secret to hold it, and
      the key is NOT written into the distribution's configuration. It is scoped
      to this one site.

  SecretArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing Secrets Manager secret holding the site key, if you
      would rather create it yourself than pass SiteKey to CloudFormation. This
      is the tighter option: the key never enters a stack parameter. The secret
      may hold the bare key, or JSON with a NORG_SITE_KEY field.

  ProbeToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Authorises the x-norg-edge-check health probe and nothing else. NORG
      issues it alongside the site key. Blank disables the probe.

  NorgEnvironment:
    Type: String
    Default: production
    AllowedValues: [production, test]
    Description: >-
      Which NORG environment this install is bound to. A test-bound install
      serves TEST content and must never be left looking like a production one.

  NorgApiUrl:
    Type: String
    Default: https://content-craft-api.norg.ai
  NorgContentBase:
    Type: String
    Default: https://edge-content.norg.ai
  StripFallbackEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Serve a stripped copy of your own page when NORG has not rendered it yet.
  LazyRenderEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Ask NORG to render a page the first time an agent asks for it.
  EdgeDisabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      The kill switch. "true" makes the router pass every request straight
      through — no mirror, no strip, no NORG calls — while leaving everything
      installed. Note there is no instant off on CloudFront: this is a
      distribution update and takes 5-15 minutes to propagate. Set it back
      to "false" to resume.
  ReplicateSecret:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Replicate the site-key secret to the twelve other regions Lambda@Edge
      executes in, so the router reads it in the region that ran it rather than
      round-tripping to us-east-1 from Sydney or Dublin. Each replica is billed
      as a secret in its region. Only applies to the secret this stack creates;
      if you pass SecretArn, replicate it yourself or leave the router to read
      the primary.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: >-
      Optional SNS topic ARN. The stack creates alarms for router errors and
      heartbeat failures either way; give them somewhere to go.
  EnableRateLimit:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Attach a WAF with one per-IP rate-based rule. On by default: every page
      request is a Lambda@Edge invocation, and the regional concurrency quota
      is the one limit that answers a visitor with a 503 when breached. Costs
      ~$6/month; set "false" if you already run WAF and add the rule to your
      own ACL instead.
  RateLimitPerFiveMinutes:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Requests per source IP per 5 minutes before WAF blocks it (EnableRateLimit only).

  # DELIBERATELY NO DEFAULT. S3 bucket names are globally unique across all AWS
  # accounts, and this repository is public — so a default naming a bucket that
  # NORG had not yet created could be claimed by anyone, and every stack
  # launched from this template would then install THEIR code as a Lambda@Edge
  # function, with an IAM role, in front of the whole site. Requiring the value
  # means a deploy cannot silently resolve to an unowned name.
  #
  # Ask NORG for the current bucket, key and object version. Mirroring the
  # objects into your own bucket and pointing these at it is fully supported and
  # is the right choice if your policy forbids deploying third-party code.
  ArtifactBucket:
    Type: String
    MinLength: 3
    Description: >-
      S3 bucket (us-east-1) holding the published router zip, as given to you by
      NORG. Lambda code cannot be inlined above 4 KB, so it is fetched from here.
  ArtifactKey:
    Type: String
    MinLength: 1
    Description: S3 key of the edge-router zip, e.g. edge-router-lambda/0.1.0.zip
  HeartbeatArtifactKey:
    Type: String
    MinLength: 1
    Description: S3 key of the heartbeat zip, e.g. heartbeat-lambda/0.1.0.zip
  ArtifactObjectVersion:
    Type: String
    Default: ""
    Description: >-
      Optional but recommended. S3 object version of the edge-router zip. Pinning
      it means the code deployed into your account cannot change even if the
      object behind the key is later replaced.
  HeartbeatObjectVersion:
    Type: String
    Default: ""
    Description: Optional. S3 object version of the heartbeat zip.

Conditions:
  CreateSiteKeySecret: !Equals [!Ref SecretArn, ""]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  ReplicateSecret: !Equals [!Ref ReplicateSecret, "true"]
  RateLimitEnabled: !Equals [!Ref EnableRateLimit, "true"]
  HasArtifactObjectVersion: !Not [!Equals [!Ref ArtifactObjectVersion, ""]]
  HasHeartbeatObjectVersion: !Not [!Equals [!Ref HeartbeatObjectVersion, ""]]
  HasAlternateDomainNames: !Not [!Equals [!Join ["", !Ref AlternateDomainNames], ""]]

Resources:
  # The site key, held once. It used to travel as an origin custom header and
  # again as a plaintext environment variable on the heartbeat, which put it in
  # reach of anyone with cloudfront:GetDistributionConfig or
  # lambda:GetFunctionConfiguration and made rotation a two-place operation.
  # Pass SecretArn instead if you would rather the key never entered a stack
  # parameter at all.
  SiteKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSiteKeySecret
    Properties:
      Description: !Sub "NORG edge router site key for ${SiteId}"
      SecretString: !Ref SiteKey
      # A replica keeps the primary's ARN with only the region changed, which
      # is what lets the router substitute AWS_REGION into the ARN and read
      # locally. The read policy below is region-wildcarded for the same reason.
      ReplicaRegions: !If
        - ReplicateSecret
        - 
          - Region: us-east-2
          - Region: us-west-1
          - Region: us-west-2
          - Region: ap-south-1
          - Region: ap-northeast-1
          - Region: ap-northeast-2
          - Region: ap-southeast-1
          - Region: ap-southeast-2
          - Region: eu-central-1
          - Region: eu-west-1
          - Region: eu-west-2
          - Region: sa-east-1
        - !Ref "AWS::NoValue"

  # Lambda@Edge requires BOTH principals: lambda.amazonaws.com to create the
  # function, edgelambda.amazonaws.com to replicate it to the edge locations.
  EdgeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, edgelambda.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSiteKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # The same secret in ANY region: a replica's ARN differs from
                # the primary's only in the region segment, and the router reads
                # the replica in the region that ran it. Still one secret, by
                # name — never a wildcard on the name.
                Resource: !Join
                  - ":"
                  - - arn
                    - !Ref AWS::Partition
                    - secretsmanager
                    - "*"
                    - !Select [4, !Split [":", !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]]]
                    - secret
                    - !Select [6, !Split [":", !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]]]

  EdgeRouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: edge-router-lambda.handler
      # nodejs24.x, not 20.x: Node 20 reached Lambda end-of-support on
      # 2026-04-30 — no security patches, no new functions from 2027-02-01,
      # no updates to existing ones from 2027-03-01. Lambda@Edge accepts 24
      # (verified by association, despite third-party docs still claiming
      # 18/20 only). Keep both functions on the same runtime.
      Runtime: nodejs24.x
      Role: !GetAtt EdgeFunctionRole.Arn
      # Lambda@Edge caps origin-request at 30s; this leaves room under it while
      # the function's own watchdog degrades to the origin well before either.
      Timeout: 30
      # 192 MB, not the 512 MB this started at. Measured on a live install:
      # peak 116 MB across 91 invocations, so this keeps ~65% headroom while
      # cutting billed GB-seconds by 62% — Lambda@Edge charges per GB-second and
      # has no free tier, so the over-provisioning was a straight multiplier on
      # every request. Do not drop to 128 MB: the strip fallback buffers a whole
      # origin response body.
      MemorySize: 192
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
        S3ObjectVersion: !If [HasArtifactObjectVersion, !Ref ArtifactObjectVersion, !Ref "AWS::NoValue"]

  # Lambda@Edge cannot reference $LATEST or an alias — only a numbered version.
  #
  # The Description is load-bearing, not documentation. AWS::Lambda::Version
  # publishes a new version only when ITS OWN properties change, and
  # FunctionName does not change when the function's code does — so updating the
  # artifact would update $LATEST while the distribution stayed pinned to the
  # version it first published. The router would appear to deploy and the edge
  # would keep running the old code, silently, forever. Naming the artifact here
  # is what forces a new version whenever the code changes.
  EdgeRouterVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EdgeRouterFunction
      Description: !Sub "${ArtifactKey}@${ArtifactObjectVersion}"

  # Cache policy for the no-Lambda asset carve-outs — the only caching this
  # distribution does. Pages are never cached at the edge: the default and
  # MCP behaviours use CloudFront's managed CachingDisabled policy, so every
  # page request reaches the router and your origin answers it. Query strings
  # ARE in the asset key, because framework asset URLs use them as
  # cache-busters (?dpl=…) and for parameters (/_next/image?url=…&w=640).
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-norg-static"
        Comment: NORG edge router - carve-outs served without invoking the router
        DefaultTTL: 86400
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

  # The router reports where a visit came from. CloudFront only adds these
  # headers when a policy asks for it, and they are unavailable to viewer-facing
  # functions either way — which is one reason the router is origin-facing.
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-norg-origin-request"
        Comment: NORG edge router - forwards viewer geo headers to the function
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-City
            - CloudFront-Viewer-ASN
            - CloudFront-Viewer-HTTP-Version
            - CloudFront-Viewer-TLS
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "NORG edge router - ${OriginDomainName}"
        HttpVersion: http2and3
        WebACLId: !If [RateLimitEnabled, !GetAtt RateLimitWebAcl.Arn, !Ref "AWS::NoValue"]
        IPV6Enabled: true
        Aliases: !If [HasAlternateDomainNames, !Ref AlternateDomainNames, !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasAlternateDomainNames
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: customer-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            # This is how install config reaches the router: Lambda@Edge
            # supports no environment variables at all. The router deletes
            # these before the request continues, so they never reach your own
            # web server or its access logs.
            OriginCustomHeaders:
              - HeaderName: x-norg-site-id
                HeaderValue: !Ref SiteId
              - HeaderName: x-norg-secret-arn
                HeaderValue: !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]
              - HeaderName: x-norg-probe-token
                HeaderValue: !Ref ProbeToken
              - HeaderName: x-norg-api-url
                HeaderValue: !Ref NorgApiUrl
              - HeaderName: x-norg-content-base
                HeaderValue: !Ref NorgContentBase
              - HeaderName: x-norg-env
                HeaderValue: !Ref NorgEnvironment
              - HeaderName: x-norg-strip-fallback
                HeaderValue: !Ref StripFallbackEnabled
              - HeaderName: x-norg-lazy-render
                HeaderValue: !Ref LazyRenderEnabled
              - HeaderName: x-norg-disabled
                HeaderValue: !Ref EdgeDisabled
        # GENERATED by aws/build.mjs from STATIC_ASSET_SUFFIXES and
        # DEFAULT_ROUTE_EXCLUSIONS — do not hand-edit; run `npm run build:aws`.
        #
        # These carry NO Lambda association, so the router is never invoked for
        # them and never billed. That is the CloudFront equivalent of the
        # no-worker routes install_exclusion_routes.py binds on Cloudflare.
        #
        # ORDER IS LOAD-BEARING: CloudFront matches behaviours in listed order,
        # first match wins, and the default behaviour is always last. Nothing
        # here may shadow a NORG-served path — build.mjs asserts that.
        CacheBehaviors:
          # BEGIN GENERATED CACHE BEHAVIOURS
          - PathPattern: "/.well-known/mcp.json"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref EdgeRouterVersion
                IncludeBody: true
          - PathPattern: "*/mcp"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref EdgeRouterVersion
                IncludeBody: true
          - PathPattern: "*/sse"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref EdgeRouterVersion
                IncludeBody: true
          - PathPattern: "/api/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/wp-json/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/wp-admin/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/wp-login.php"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/cart"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/cart/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/checkout"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/checkout/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/_next/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "/_vercel/*"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.css"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.js"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.mjs"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.map"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.png"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.jpg"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.jpeg"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.gif"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.webp"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.svg"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.ico"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.avif"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.woff"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.woff2"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.ttf"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.otf"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.mp4"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.webm"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.mov"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.mp3"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.wav"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.ogg"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.m4a"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.pdf"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.docx"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.xlsx"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.pptx"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.zip"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.gz"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          - PathPattern: "*.webmanifest"
            TargetOriginId: customer-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
          # END GENERATED CACHE BEHAVIOURS
        DefaultCacheBehavior:
          TargetOriginId: customer-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # POST is allowed because the MCP JSON-RPC transport needs it; the
          # router passes every other non-GET method straight through.
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          # Managed CachingDisabled: the human page is never cached at the
          # edge. Every page request invokes the router, which answers an
          # ordinary browser before any lookup, and your origin serves the
          # page as it always did. There is deliberately no cache key to get
          # wrong here, and no cache guard to defeat.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          LambdaFunctionAssociations:
            - EventType: origin-request
              LambdaFunctionARN: !Ref EdgeRouterVersion
              # OFF here, on purpose. IncludeBody is per association, not per
              # path, and on the default behaviour it delivered every POST body
              # on the site (logins, checkouts, forms) into the router's
              # memory. The one surface that needs a body — the MCP JSON-RPC
              # transport — has its own generated behaviours above, and only
              # those include the body.
              IncludeBody: false

  # Replaces the Cloudflare cron trigger, which Lambda@Edge has no equivalent
  # of. Not an edge function, so it MAY use environment variables.
  HeartbeatRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSiteKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # The same secret in ANY region: a replica's ARN differs from
                # the primary's only in the region segment, and the router reads
                # the replica in the region that ran it. Still one secret, by
                # name — never a wildcard on the name.
                Resource: !Join
                  - ":"
                  - - arn
                    - !Ref AWS::Partition
                    - secretsmanager
                    - "*"
                    - !Select [4, !Split [":", !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]]]
                    - secret
                    - !Select [6, !Split [":", !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]]]

  HeartbeatFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: heartbeat-lambda.handler
      # Same runtime as EdgeRouterFunction — see the note there.
      Runtime: nodejs24.x
      Role: !GetAtt HeartbeatRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SITE_ID: !Ref SiteId
          NORG_SECRET_ARN: !If [CreateSiteKeySecret, !Ref SiteKeySecret, !Ref SecretArn]
          NORG_API_URL: !Ref NorgApiUrl
          EDGE_ENV: !Ref NorgEnvironment
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref HeartbeatArtifactKey
        S3ObjectVersion: !If [HasHeartbeatObjectVersion, !Ref HeartbeatObjectVersion, !Ref "AWS::NoValue"]

  HeartbeatSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: NORG edge router liveness beat
      # The same cadence as the Cloudflare worker's cron trigger.
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: heartbeat
          Arn: !GetAtt HeartbeatFunction.Arn

  HeartbeatPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HeartbeatFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HeartbeatSchedule.Arn

  # A router error is a 502 on the customer's site; a heartbeat error means
  # NORG rejected the install's credentials. Both are silent without this.
  # Lambda@Edge publishes its metrics under "us-east-1.<function>" in every
  # region it ran in; the aggregate is readable here in us-east-1.
  RouterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-norg-router-errors"
      AlarmDescription: NORG edge router returned an error (502 to visitors)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "us-east-1.${EdgeRouterFunction}"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  HeartbeatErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-norg-heartbeat-errors"
      AlarmDescription: NORG heartbeat failing — credentials rejected or NORG unreachable
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HeartbeatFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  # Rate limit, on by default. Every page request invokes Lambda@Edge, on your
  # bill and against the regional concurrency quota — so a scraper can run the
  # meter and, past the quota, turn every page request in that region into a
  # 503. This is a single rate-based rule; if you already run WAF, set
  # EnableRateLimit to "false" and add the rule to your own ACL.
  RateLimitWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: RateLimitEnabled
    Properties:
      Name: !Sub "${AWS::StackName}-norg-rate-limit"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-norg-rate-limit"
      Rules:
        - Name: per-ip-rate
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerFiveMinutes
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-norg-per-ip-rate"

Outputs:
  DistributionDomainName:
    Description: Test against this before pointing any DNS at it.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  EdgeRouterVersionArn:
    Description: Give this to NORG if you want the install verified from their side.
    Value: !Ref EdgeRouterVersion
