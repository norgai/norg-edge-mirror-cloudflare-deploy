# Fastly Compute service manifest for the NORG edge router.
#
# The two stores and the backends below are the whole install surface. Create
# them with `fastly compute publish`, or declaratively with the fastly/fastly
# Terraform provider (fastly_service_compute + fastly_configstore +
# fastly_secretstore).
#
# DYNAMIC BACKENDS: not used. Every host this router talks to is known at
# install time — the customer's origin, NORG's API, and NORG's edge-content
# service — so they are declared as static backends here. That avoids the
# service-level dynamic-backends toggle (which needs a Fastly support ticket on
# some accounts) and keeps the set of reachable hosts auditable by the customer.
#
# TIMEOUTS ARE LOAD-BEARING ON THIS PLATFORM, AND THEY ARE NOT SET IN THIS FILE.
# Every other provider bounds its outbound NORG calls with AbortSignal.timeout();
# Fastly's runtime has no AbortSignal, so core/http.js:timeoutSignal() returns
# undefined here and the ONLY thing bounding a hung NORG is the per-backend
# first_byte_timeout on the SERVICE backends, set at install time via the API
# (the [local_server] block below is a dev harness and ignores timeout keys).
# Match core/constants.mjs when creating them: norg_api 5000ms — the feed fetch,
# the longest call it serves — and norg_content 4000ms for the mirror fetch.
# Omitting them does not fall back to some other limit; it removes the limit.
# The customer's own origin keeps Fastly's defaults: we never impose a shorter
# timeout on their site than they chose for it.
authors = ["NORG.ai"]
description = "Serves NORG-optimised content to AI agents at your own URLs; every other visitor gets your site unchanged."
language = "javascript"
manifest_version = 3
name = "norg-edge-router"
service_id = ""

[scripts]
  build = "npm run build"

[local_server]

  [local_server.backends]

    # Placeholder. `fastly compute serve` reads this block only; point it at the
    # site you are testing against and add `override_host` to match, or the
    # origin sees Host: 127.0.0.1 and a host-routed origin will refuse it.
    [local_server.backends.customer_origin]
      url = "https://example.com"

    [local_server.backends.norg_api]
      url = "https://content-craft-api.norg.ai"

    [local_server.backends.norg_content]
      url = "https://edge-content.norg.ai"

  [local_server.config_stores]

    [local_server.config_stores.norg_edge_config]
      format = "inline-toml"

      [local_server.config_stores.norg_edge_config.contents]
        site_id = "REPLACE_WITH_SITE_ID"
        edge_env = "test"

  [local_server.secret_stores]

    [[local_server.secret_stores.norg_edge_secrets]]
      key = "norg_site_key"
      data = "REPLACE_WITH_SITE_KEY"
